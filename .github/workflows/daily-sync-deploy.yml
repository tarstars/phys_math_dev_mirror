name: Daily Sync And Deploy

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      recovery_only:
        description: Export and reimport content as an artifact without committing or deploying
        type: boolean
        default: false
      full_backfill:
        description: Recheck the complete Telegram history
        type: boolean
        default: false
      prepare_ru_drafts:
        description: Create unpublished Russian translation drafts for manual review
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export public Telegram messages for recovery
        if: inputs.recovery_only == true
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TELEGRAM_CHANNEL: phys_math_dev
        run: python scripts/export_telegram.py --output data/recovery/telegram.json

      - name: Sync EN content from Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TELEGRAM_CHANNEL: phys_math_dev
          SYNC_RECENT_WINDOW: 250
          MAX_VIDEO_BYTES: 26214400
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          PUBLIC_MEDIA_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          FULL_BACKFILL: ${{ inputs.full_backfill }}
        run: |
          args=()
          if [[ "$FULL_BACKFILL" == "true" ]]; then args+=(--full-backfill); fi
          python scripts/sync_telegram.py "${args[@]}"

      - name: Save recovered English source before translation
        if: always() && inputs.recovery_only == true
        uses: actions/upload-artifact@v4
        with:
          name: recovered-telegram-source
          retention-days: 7
          path: |
            content/en/posts
            data/state
            data/recovery

      - name: Prepare unpublished Russian translation drafts
        if: inputs.prepare_ru_drafts == true
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TELEGRAM_CHANNEL: phys_math_dev
        run: python scripts/translate_ru_drafts.py

      - name: Save recovered content for review
        if: always() && inputs.recovery_only == true
        uses: actions/upload-artifact@v4
        with:
          name: recovered-telegram-content
          retention-days: 7
          path: |
            content/en/posts
            content/ru/posts
            data/state
            data/recovery

      - name: Commit synced content if changed
        if: inputs.recovery_only != true
        run: |
          if [[ -n "$(git status --porcelain content/en/posts content/ru/posts data/state)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/en/posts content/ru/posts data/state
            git commit -m "chore(sync): daily telegram sync"
            git push
          else
            echo "No content/state changes to commit"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build site
        env:
          PUBLIC_SITE_URL: https://phys-math.dev
          PUBLIC_MEDIA_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ secrets.PUBLIC_CF_ANALYTICS_TOKEN }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: inputs.recovery_only != true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist --project-name "${{ secrets.CF_PAGES_PROJECT_NAME }}"
