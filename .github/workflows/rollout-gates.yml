name: Rollout Gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Gate 0 - Baseline (no credentials)
        env:
          PUBLIC_SITE_URL: https://phys-math.dev
          PUBLIC_MEDIA_BASE_URL: https://media.phys-math.dev
        run: |
          npm run build
          python -m py_compile scripts/*.py
          echo "Gate 0 passed"

      - name: Gate 1 - Telegram API ID and Hash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          missing=()

          [[ -n "${TELEGRAM_API_ID}" ]] || missing+=("TELEGRAM_API_ID")
          [[ -n "${TELEGRAM_API_HASH}" ]] || missing+=("TELEGRAM_API_HASH")

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Gate 1 failed. Add GitHub secrets: ${missing[*]}"
            exit 1
          fi

          echo "Gate 1 passed"

      - name: Gate 2 - Telegram StringSession and channel access
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TELEGRAM_CHANNEL: phys_math_dev
        run: |
          if [[ -z "${TELEGRAM_STRING_SESSION}" ]]; then
            echo "::error::Gate 2 failed. Add GitHub secret TELEGRAM_STRING_SESSION"
            exit 1
          fi

          python - <<'PY'
import asyncio
import os

from telethon import TelegramClient
from telethon.sessions import StringSession


async def main() -> None:
    api_id = int(os.environ["TELEGRAM_API_ID"])
    api_hash = os.environ["TELEGRAM_API_HASH"]
    session = os.environ["TELEGRAM_STRING_SESSION"]
    channel = os.environ.get("TELEGRAM_CHANNEL", "phys_math_dev")

    client = TelegramClient(StringSession(session), api_id, api_hash)
    await client.connect()

    if not await client.is_user_authorized():
        raise RuntimeError("StringSession is not authorized")

    entity = await client.get_entity(channel)
    latest = await client.get_messages(entity, limit=1)

    if not latest:
        raise RuntimeError(f"Cannot read channel history for {channel}")

    latest_id = latest[0].id if isinstance(latest, list) else latest.id
    print(f"Telegram access OK. Channel={channel} latest_id={latest_id}")

    await client.disconnect()


asyncio.run(main())
PY

          echo "Gate 2 passed"

      - name: Gate 3 - R2 media credentials
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          missing=()

          [[ -n "${R2_ENDPOINT}" ]] || missing+=("R2_ENDPOINT")
          [[ -n "${R2_BUCKET}" ]] || missing+=("R2_BUCKET")
          [[ -n "${R2_ACCESS_KEY_ID}" ]] || missing+=("R2_ACCESS_KEY_ID")
          [[ -n "${R2_SECRET_ACCESS_KEY}" ]] || missing+=("R2_SECRET_ACCESS_KEY")
          [[ -n "${R2_PUBLIC_BASE_URL}" ]] || missing+=("R2_PUBLIC_BASE_URL")

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Gate 3 failed. Add GitHub secrets: ${missing[*]}"
            exit 1
          fi

          python - <<'PY'
import os

import boto3

endpoint = os.environ["R2_ENDPOINT"]
bucket = os.environ["R2_BUCKET"]
access_key_id = os.environ["R2_ACCESS_KEY_ID"]
secret_access_key = os.environ["R2_SECRET_ACCESS_KEY"]

client = boto3.client(
    "s3",
    endpoint_url=endpoint,
    aws_access_key_id=access_key_id,
    aws_secret_access_key=secret_access_key,
    region_name="auto",
)

client.list_objects_v2(Bucket=bucket, MaxKeys=1)
print(f"R2 credentials OK for bucket={bucket}")
PY

          echo "Gate 3 passed"

      - name: Gate 4 - Cloudflare Pages deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT_NAME: ${{ secrets.CF_PAGES_PROJECT_NAME }}
          PUBLIC_SITE_URL: https://phys-math.dev
          PUBLIC_MEDIA_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          missing=()

          [[ -n "${CLOUDFLARE_API_TOKEN}" ]] || missing+=("CLOUDFLARE_API_TOKEN")
          [[ -n "${CLOUDFLARE_ACCOUNT_ID}" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [[ -n "${CF_PAGES_PROJECT_NAME}" ]] || missing+=("CF_PAGES_PROJECT_NAME")

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Gate 4 failed. Add GitHub secrets: ${missing[*]}"
            exit 1
          fi

          npm run build
          npx wrangler pages deploy dist \
            --project-name "${CF_PAGES_PROJECT_NAME}" \
            --branch "rollout-gates-${GITHUB_RUN_NUMBER}"

          echo "Gate 4 passed"
